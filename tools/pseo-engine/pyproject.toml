[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseo-engine"
version = "0.1.0"
description = "CalculatePilot programmatic SEO engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pseo = "pseo.cli:main"

[tool.setuptools.packages.find]
include = ["pseo*"]

[tool.setuptools.package-data]
pseo = ["templates/*.j2", "generate/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
