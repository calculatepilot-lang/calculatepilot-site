name: PSEO generator tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/pseo-engine/pseo/**'
      - 'tools/pseo-engine/tests/**'
      - 'tools/pseo-engine/pyproject.toml'
      - '.github/workflows/pseo-tests.yml'
  pull_request:
    paths:
      - 'tools/pseo-engine/pseo/**'
      - 'tools/pseo-engine/tests/**'
      - 'tools/pseo-engine/pyproject.toml'
      - '.github/workflows/pseo-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pseo-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: pip install -e . pytest
      - name: Run PSEO tests
        run: python -m pytest -q
