name: Publish CalculatePilot Guide Index

on:
  push:
    branches: [main]
    paths:
      - 'guides/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and publish guide metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          import re

          root = Path('.')
          index = root / 'guides' / 'index.html'
          sitemap = root / 'sitemap-guides.xml'
          today = date.today().isoformat()

          if not sitemap.exists():
              raise SystemExit('sitemap-guides.xml not found')
          if not index.exists():
              raise SystemExit('guides/index.html not found')

          sm = sitemap.read_text(encoding='utf-8')
          if '</urlset>' not in sm:
              raise SystemExit('sitemap-guides.xml is missing </urlset>; refusing to rewrite')

          ids = []
          changed = False
          for p in sorted((root / 'guides').glob('*.html')):
              if p.name == 'index.html':
                  continue
              text = p.read_text(encoding='utf-8', errors='strict')
              ids.extend(re.findall(r'^id:\s*([^\s]+)', text, flags=re.M))
              slug = p.name
              href = f'/guides/{slug}'
              url = f'https://www.calculatepilot.com/guides/{slug}'

              idx = index.read_text(encoding='utf-8')
              if f'href="{href}"' not in idx:
                  # Prefer the first finance grid; fall back to first tool-grid.
                  inserted = False
                  for marker in (
                      '<div class="tool-grid">\n',
                  ):
                      if marker in idx:
                          title = re.search(r'<title>([^<]+)</title>', text, flags=re.I)
                          label = title.group(1).split('|')[0].strip() if title else slug.replace('-', ' ').replace('.html', '')
                          link = f'<a href="{href}" class="tool-link">{label} <span class="arrow">→</span></a>\n'
                          index.write_text(idx.replace(marker, marker + link, 1), encoding='utf-8')
                          inserted = True
                          changed = True
                          break
                  if not inserted:
                      print(f'WARN: no index insertion marker for {slug}; leaving guides/index.html unchanged')

              if f'<loc>{url}</loc>' not in sm:
                  entry = (
                      f'  <url>\n'
                      f'    <loc>{url}</loc>\n'
                      f'    <lastmod>{today}</lastmod>\n'
                      f'    <changefreq>weekly</changefreq>\n'
                      f'  </url>\n'
                  )
                  sm = sm.replace('</urlset>', entry + '</urlset>', 1)
                  changed = True
                  print(f'Added {url} to sitemap-guides.xml')

          dupes = sorted({i for i in ids if ids.count(i) > 1})
          if dupes:
              raise SystemExit(f'Duplicate-publication check failed: {dupes}')

          if changed:
              sitemap.write_text(sm, encoding='utf-8')
          else:
              print('Guides already present in index/sitemap; nothing to rewrite')
          PY

      - name: Commit generated publication updates
        run: |
          git config user.name 'calculatepilot-guides-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guides/index.html sitemap-guides.xml
          if git diff --cached --quiet; then
            echo 'No publication index changes required.'
            exit 0
          fi
          git commit -m 'Publish new guides to Guides index and sitemap-guides.xml'
          git push origin main
