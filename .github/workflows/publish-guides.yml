name: Publish CalculatePilot Guide Index

on:
  push:
    branches: [main]
    paths:
      - 'guides/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and publish guide metadata
        env:
          GUIDE_ID: cp-guide-debt-payoff-payment-strategy-20260902
          GUIDE_SLUG: debt-payoff-calculator-guide.html
          GUIDE_URL: https://www.calculatepilot.com/guides/debt-payoff-calculator-guide.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('.')
          guide = root / 'guides' / 'debt-payoff-calculator-guide.html'
          index = root / 'guides' / 'index.html'
          sitemap = root / 'sitemap.xml'
          guide_id = 'cp-guide-debt-payoff-payment-strategy-20260902'
          guide_url = 'https://www.calculatepilot.com/guides/debt-payoff-calculator-guide.html'

          if not guide.exists():
              raise SystemExit('Guide file not found')

          ids = []
          for p in sorted((root / 'guides').glob('*.html')):
              text = p.read_text(encoding='utf-8', errors='strict')
              ids.extend(re.findall(r'^id:\s*([^\s]+)', text, flags=re.M))
          if ids.count(guide_id) != 1:
              raise SystemExit(f'Duplicate-publication check failed: {guide_id!r} occurs {ids.count(guide_id)} times')

          idx = index.read_text(encoding='utf-8')
          link = '<a href="/guides/debt-payoff-calculator-guide.html" class="tool-link">Debt Payoff Calculator Guide <span class="arrow">→</span></a>'
          if 'href="/guides/debt-payoff-calculator-guide.html"' not in idx:
              marker = '</div>\n<h2>Money &amp; health explainers</h2>'
              if marker not in idx:
                  raise SystemExit('Guides index insertion marker not found; refusing to rewrite index')
              idx = idx.replace(marker, link + '\n' + marker, 1)
              index.write_text(idx, encoding='utf-8')

          sm = sitemap.read_text(encoding='utf-8')
          if f'<loc>{guide_url}</loc>' not in sm:
              marker = '</urlset>'
              if marker not in sm:
                  raise SystemExit('Sitemap closing marker not found; refusing to rewrite sitemap')
              sm = sm.replace(marker, f'  <url><loc>{guide_url}</loc></url>\n{marker}', 1)
              sitemap.write_text(sm, encoding='utf-8')
          PY

      - name: Commit generated publication updates
        run: |
          git config user.name 'calculatepilot-guides-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guides/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No publication index changes required.'
            exit 0
          fi
          git commit -m 'Publish Debt Payoff Calculator Guide to Guides index and sitemap'
          git push origin main
