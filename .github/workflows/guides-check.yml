name: Guides check

# Every guide must use the article template, have Article + BreadcrumbList schema and be listed in sitemap-guides.xml.
# Fix a failure with:  python tools/guide_build.py --schema-only <slug>   (schema + sitemap)   or rebuild the guide.
on:
  pull_request:
    paths:
      - 'guides/**'
      - 'tools/guides/**'
      - 'tools/guide_build.py'
      - 'sitemap-guides.xml'
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'sitemap-guides.xml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guides pass the publish gate
        run: python tools/guides/check.py
