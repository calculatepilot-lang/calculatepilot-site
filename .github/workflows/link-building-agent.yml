name: Link Building Agent

on:
  schedule:
    - cron: '0 9 * * *'  # every day 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run link-building agent
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/link_building_agent.py

      - name: Commit updated log
        run: |
          git config user.name 'calculatepilot-linkbuilder-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/link_building_log.json
          if git diff --cached --quiet; then
            echo 'No log changes.'
            exit 0
          fi
          git commit -m 'Daily link-building agent run'
          git push origin main
