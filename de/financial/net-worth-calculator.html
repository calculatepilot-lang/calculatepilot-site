<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vermögensrechner | CalculatePilot</title><meta name="description" content="Berechnen Sie Ihr Nettovermögen aus Vermögenswerten und Schulden."><link rel="canonical" href="https://www.calculatepilot.com/de/financial/net-worth-calculator.html"><link rel="alternate" hreflang="en" href="https://www.calculatepilot.com/financial/net-worth-calculator.html"><link rel="alternate" hreflang="fr" href="https://www.calculatepilot.com/fr/financial/net-worth-calculator.html"><link rel="alternate" hreflang="de" href="https://www.calculatepilot.com/de/financial/net-worth-calculator.html"><link rel="alternate" hreflang="es" href="https://www.calculatepilot.com/es/financial/net-worth-calculator.html"><link rel="stylesheet" href="/css/styles.css"></head><body><main><section class="calc-page-head"><div class="container"><h1>Vermögensrechner</h1><p class="lede">Vergleichen Sie Ihre Vermögenswerte mit Ihren Schulden und ermitteln Sie Ihr Nettovermögen.</p></div></section><section class="section"><div class="container"><div class="calculator-card"><label>Gesamtvermögen <input id="a" type="number" value="100000"></label><label>Gesamtschulden <input id="d" type="number" value="40000"></label><button onclick="calc()">Berechnen</button><div id="o"></div></div><div class="prose"><h2>Nettovermögen</h2><p>Das Nettovermögen entspricht Ihren Vermögenswerten abzüglich aller Schulden. Verfolgen Sie die Zahl regelmäßig, um Ihre finanzielle Entwicklung zu beobachten.</p></div></div></section></main><script>function calc(){o.innerHTML='<h2>Nettovermögen: '+(+a.value-+d.value).toLocaleString('de-DE',{style:'currency',currency:'EUR'})+'</h2>';}</script></body></html>
