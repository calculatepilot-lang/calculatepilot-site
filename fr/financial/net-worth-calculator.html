<meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de valeur nette | CalculatePilot</title><meta name="description" content="Calculez votre valeur nette en soustrayant vos dettes de vos actifs."><link rel="canonical" href="https://www.calculatepilot.com/financial/net-worth-calculator.html"><link rel="alternate" hreflang="en" href="https://www.calculatepilot.com/financial/net-worth-calculator.html"><link rel="alternate" hreflang="fr" href="https://www.calculatepilot.com/fr/financial/net-worth-calculator.html"><link rel="alternate" hreflang="de" href="https://www.calculatepilot.com/de/financial/net-worth-calculator.html"><link rel="alternate" hreflang="es" href="https://www.calculatepilot.com/es/financial/net-worth-calculator.html"><link rel="stylesheet" href="/css/styles.css"><script src="https://rankai.ai/apply.js" data-rankai-id="cmuatpvmp000214wzocy8ihac" crossorigin="anonymous" defer></script></head><body><main><section class="calc-page-head"><div class="container"><h1>Calculateur de valeur nette</h1><p class="lede">Mesurez votre patrimoine net en comparant vos actifs et vos dettes.</p></div></section><section class="section"><div class="container"><div class="calculator-card"><label>Total des actifs <input id="a" type="number" value="100000"></label><label>Total des dettes <input id="d" type="number" value="40000"></label><button onclick="calc()">Calculer</button><div id="o"></div></div><div class="prose"><h2>Valeur nette</h2><p>Votre valeur nette correspond à la valeur de vos actifs moins l'ensemble de vos dettes. Utilisez-la pour suivre l'évolution de votre situation financière au fil du temps.</p></div></div></section></main><script>function calc(){o.innerHTML='<h2>Valeur nette : '+(+a.value-+d.value).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+'</h2>';}</script></body></html>
