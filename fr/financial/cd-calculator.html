<main>
<section class="calc-page-head"><div class="container"><h1>Calculateur de dépôt à terme</h1><p class="lede">Capital final d’un dépôt à terme à intérêts annuels.</p></div></section>
<section><div class="container calc-layout">
<form class="calc-card" oninput="calc()">
<div class="field"><label for="p">Montant</label><input type="number" id="p" value="10000" step="100" min="0"></div>
<div class="field"><label for="r">Taux annuel (%)</label><input type="number" id="r" value="3.2" step="0.1" min="0"></div>
<div class="field"><label for="y">Durée (ans)</label><input type="number" id="y" value="2" step="0.5" min="0"></div>
</form>
<aside class="readout"><div class="bar"></div><div class="readout-body">
<div class="readout-label">Capital final</div>
<div class="readout-value big" id="o1">—</div>
<div class="readout-breakdown">
<div class="readout-row"><span>Intérêts</span><span id="o2">—</span></div>
<div class="readout-row"><span>Placement</span><span id="o3">—</span></div>
</div></div></aside>
</div></section>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 CalculatePilot.</span></div></div></footer>
<script src="/js/nav.js?v=ed5961c9"></script>
<script>
function g(id){return document.getElementById(id).value}
function o(id,v){document.getElementById(id).textContent=v}
function money(id,v){o(id,new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v))}
function calc(){
const P=+g('p')||0,r=(+g('r')||0)/100,y=+g('y')||0;
const fv=P*Math.pow(1+r,y);
money('o1',fv); money('o2',fv-P); money('o3',P);
}
calc();
</script>
