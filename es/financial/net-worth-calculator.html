<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de patrimonio neto | CalculatePilot</title><meta name="description" content="Calcula tu patrimonio neto restando tus deudas de tus activos."><link rel="canonical" href="https://www.calculatepilot.com/es/financial/net-worth-calculator.html"><link rel="alternate" hreflang="en" href="https://www.calculatepilot.com/financial/net-worth-calculator.html"><link rel="alternate" hreflang="fr" href="https://www.calculatepilot.com/fr/financial/net-worth-calculator.html"><link rel="alternate" hreflang="de" href="https://www.calculatepilot.com/de/financial/net-worth-calculator.html"><link rel="alternate" hreflang="es" href="https://www.calculatepilot.com/es/financial/net-worth-calculator.html"><link rel="stylesheet" href="/css/styles.css"></head><body><main><section class="calc-page-head"><div class="container"><h1>Calculadora de patrimonio neto</h1><p class="lede">Mide tu patrimonio neto comparando tus activos con tus deudas.</p></div></section><section class="section"><div class="container"><div class="calculator-card"><label>Total de activos <input id="a" type="number" value="100000"></label><label>Total de deudas <input id="d" type="number" value="40000"></label><button onclick="calc()">Calcular</button><div id="o"></div></div><div class="prose"><h2>Patrimonio neto</h2><p>El patrimonio neto es el valor de tus activos menos todas tus deudas. Puedes calcularlo periódicamente para seguir tu progreso financiero.</p></div></div></section></main><script>function calc(){o.innerHTML='<h2>Patrimonio neto: '+(+a.value-+d.value).toLocaleString('es-ES',{style:'currency',currency:'EUR'})+'</h2>';}</script></body></html>
